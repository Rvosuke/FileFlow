[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "fileflow"
version = "0.1.0"
description = "AI-assisted local file organization system for Windows."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "Codex" },
]
dependencies = [
  "rich>=13.9.0",
  "tomli-w>=1.0.0",
  "typer>=0.16.0",
  "httpx>=0.25.0",
  "watchdog>=3.0.0",
]

[project.scripts]
fileflow = "fileflow.cli:main"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
